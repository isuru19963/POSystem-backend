# Deploy NestJS API to Elastic Beanstalk on push to main.
# Repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

name: Deploy backend (Elastic Beanstalk)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment bundle
        run: |
          zip -r deploy.zip . \
            -x '*.git*' 'node_modules/*' 'dist/*' '.env' '.env.*' \
            -x 'uploads/*' 'coverage/*' '.elasticbeanstalk/logs/*' \
            -x '.elasticbeanstalk/app_versions/*'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: us-east-1
          application_name: Posystem
          environment_name: posystem-backend-prod
          version_label: run-${{ github.run_id }}-${{ github.sha }}
          deployment_package: deploy.zip
          wait_for_environment_recovery: true
